<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego Riesgos Psicosociales</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <section class="header">
      <div class="logo-badge">EHS</div>
      <div>
        <h1>Riesgos Psicosociales</h1>
        <p>Identifica si la situación representa un riesgo real o si puede ser una gestión normal del trabajo.</p>
      </div>
    </section>

    <section id="startScreen" class="card">
      <h2>Configurar juego</h2>
      <div class="config">
        <label>
          Tema
          <select id="topicSelect">
            <option value="TODOS">Todos los temas</option>
          </select>
        </label>
        <label>
          Preguntas
          <select id="amountSelect">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="999">Todas</option>
          </select>
        </label>
        <button id="startBtn">Iniciar</button>
      </div>
    </section>

    <section id="gameScreen" class="card hidden">
      <div class="hud">
        <span id="topicChip">Tema</span>
        <span>Pregunta <b id="counter">1/1</b></span>
        <span>Puntos <b id="score">0</b></span>
      </div>
      <div class="bar"><div id="progress"></div></div>
      <h2 id="questionText"></h2>
      <div class="options">
        <button id="riskBtn" class="risk">Sí es riesgo</button>
        <button id="notRiskBtn" class="not-risk">No es riesgo / gestión normal</button>
      </div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="next hidden">Siguiente</button>
    </section>

    <section id="resultScreen" class="card hidden">
      <h2 id="resultTitle">Resultado</h2>
      <p id="resultScore" class="big-score"></p>
      <p id="resultMessage"></p>
      <button id="restartBtn">Volver a jugar</button>
      <button id="reviewBtn" class="secondary">Ver revisión</button>
      <div id="review" class="review hidden"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
